name: Bug report
description: Report a reproducible problem using non-sensitive data
title: "bug: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: "Do not include API keys, private datasets, or unredacted logs. Report security issues privately as described in SECURITY.md."
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Describe the expected and actual behavior.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Include a small synthetic CSV or safe example if relevant.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: OS, browser, Docker/Compose versions, provider type (no keys).
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Safe evidence
      description: Screenshots or redacted logs, if useful.
